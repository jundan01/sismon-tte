services:
  # 1. NGINX REVERSE PROXY (EDGE)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: tte_nginx:production
    container_name: tte_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${APP_PORT:-443}:443"
    volumes:
      - .:/var/www/html:ro                       # Codebase Read-Only
      - storage_data:/var/www/html/storage       # Storage Volume Writable
    networks:
      - frontend
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /var/cache/nginx:exec,mode=0755
      - /var/run:exec,mode=0755
      - /tmp:mode=1777
    cpus: 0.50
    mem_limit: 256m
    depends_on:
      - app

  # 2. LARAVEL 13 RUNTIME & QUEUE WORKER
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: tte_php:8.3-fpm
    container_name: tte_app
    working_dir: /var/www/html
    restart: always
    volumes:
      - .:/var/www/html
      - storage_data:/var/www/html/storage
    networks:
      - frontend
      - backend
    security_opt:
      - "no-new-privileges:true"
    cpus: 1.00
    mem_limit: 512m
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  # 3. POSTGRESQL 16 ENTERPRISE ENGINE
  postgres:
    image: postgres:16-alpine
    container_name: tte_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tte_monitoring}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diatur pada berkas .env produksi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    cpus: 1.50
    mem_limit: 1024m

  # 4. REDIS 7 BUFFER & EVENT QUEUE
  redis:
    image: redis:7-alpine
    container_name: tte_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diatur pada berkas .env produksi} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    security_opt:
      - "no-new-privileges:true"
    cpus: 0.50
    mem_limit: 256m

  # ---------------------------------------------------------------------------
  # 5. DATABASE GUI (ADMINER - HANYA UNTUK TESTING / DEMO / DEV)
  # ---------------------------------------------------------------------------
  # [CATATAN PENTING SAAT PUBLISH RESMI KE PRODUKSI]:
  # Service ini dan port 8080 WAJIB DIHAPUS / DI-COMMENT sebelum deploy ke server
  # resmi produksi demi keamanan database (mencegah exposure port GUI ke publik).
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: tte_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    networks:
      - frontend
      - backend
    security_opt:
      - "no-new-privileges:true"
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      - postgres

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true                                # Isolasi Penuh: Database & Redis Tersembunyi

volumes:
  pg_data:
  redis_data:
  storage_data:

