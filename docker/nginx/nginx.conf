user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate Limiting Zones (Defense in Depth)
    limit_req_zone $binary_remote_addr zone=pendaftaran_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream to Laravel PHP-FPM
    upstream php-fpm {
        server app:9000;
    }

    # 1. HTTP Server (Port 80)
    server {
        listen 80;
        server_name localhost;
        root /var/www/html/public;
        index index.php index.html;

        client_max_body_size 5M;

        # Security Headers (Layer 1 Edge)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_req zone=general_limit burst=50 nodelay;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Rate Limiting Khusus Pendaftaran Publik
        location = /pendaftaran {
            limit_req zone=pendaftaran_limit burst=2 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # Handling Rute Autentikasi Admin (VPN Gateway)
        location ^~ /gateway/ {
            limit_req zone=pendaftaran_limit burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # Handling Rute Streaming Mass Export (Bypass Buffer & High Timeout)
        location ^~ /admin/export/ {
            try_files $uri /index.php?$query_string;
            fastcgi_buffering off;
            fastcgi_read_timeout 300;
        }

        # Handling Rute Panel Admin (VPN Gateway)
        location ^~ /admin/ {
            try_files $uri /index.php?$query_string;
        }

        # Static Assets Caching (Zero-CDN)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        # PHP-FPM Handling
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120;
        }

        # Deny hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # 2. HTTPS Server (Port 443 with SSL SAN)
    server {
        listen 443 ssl;
        server_name localhost;
        root /var/www/html/public;
        index index.php index.html;

        client_max_body_size 5M;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_req zone=general_limit burst=50 nodelay;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /pendaftaran {
            limit_req zone=pendaftaran_limit burst=2 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ^~ /gateway/ {
            limit_req zone=pendaftaran_limit burst=5 nodelay;
            try_files $uri /index.php?$query_string;
        }

        # Handling Rute Streaming Mass Export (Bypass Buffer & High Timeout)
        location ^~ /admin/export/ {
            try_files $uri /index.php?$query_string;
            fastcgi_buffering off;
            fastcgi_read_timeout 300;
        }

        location ^~ /admin/ {
            try_files $uri /index.php?$query_string;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
            access_log off;
        }

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS on;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 120;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}